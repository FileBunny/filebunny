- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
- name: Restart journald
  ansible.builtin.systemd_service: {name: systemd-journald, state: restarted}
- name: Restart fail2ban
  ansible.builtin.systemd_service: {name: fail2ban, state: restarted}
- name: Restart docker
  ansible.builtin.systemd_service: {name: docker, state: restarted}
