# Local:      docker compose up --build   → https://localhost
# Production: FILEBUNNY_DOMAIN=filebunny.eu docker compose up -d --build
services:
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      FILEBUNNY_MAX_SIZE: ${FILEBUNNY_MAX_SIZE:-104857600}
      FILEBUNNY_MAX_TOTAL_SIZE: ${FILEBUNNY_MAX_TOTAL_SIZE:-21474836480}
      FILEBUNNY_DEFAULT_EXPIRY: ${FILEBUNNY_DEFAULT_EXPIRY:-24h}
      FILEBUNNY_MAX_EXPIRY: ${FILEBUNNY_MAX_EXPIRY:-168h}
      FILEBUNNY_WKD_PROXY: ${FILEBUNNY_WKD_PROXY:-true}
      # External storage at filebin.net through this server (docs/storage/filebin.md).
      FILEBUNNY_FILEBIN: ${FILEBUNNY_FILEBIN:-false}
      FILEBUNNY_PROXY_DAILY_BYTES: ${FILEBUNNY_PROXY_DAILY_BYTES:-53687091200}
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      FILEBUNNY_DOMAIN: ${FILEBUNNY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

volumes:
  data:
  caddy_data:
  caddy_config:
