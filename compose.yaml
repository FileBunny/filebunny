# Local:      docker compose up --build   → https://localhost
# Production: FILEBUNNY_DOMAIN=filebunny.eu docker compose up -d --build
# E-mail:     FILEBUNNY_SMTP=/etc/filebunny/smtp.json (outside the repo; see docs/self-hosting.md)
# Container logs (json-file) are capped, or they grow without limit. The
# containers log no addresses; see docs/self-hosting.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    build:
      context: .
      target: backend
      args:
        # The release tag (vX.Y.Z); "dev" for local builds.
        VERSION: ${FILEBUNNY_VERSION:-dev}
    restart: unless-stopped
    environment:
      FILEBUNNY_MAX_SIZE: ${FILEBUNNY_MAX_SIZE:-104857600}
      FILEBUNNY_MAX_TOTAL_SIZE: ${FILEBUNNY_MAX_TOTAL_SIZE:-21474836480}
      FILEBUNNY_DEFAULT_EXPIRY: ${FILEBUNNY_DEFAULT_EXPIRY:-24h}
      FILEBUNNY_MAX_EXPIRY: ${FILEBUNNY_MAX_EXPIRY:-168h}
      FILEBUNNY_WKD_PROXY: ${FILEBUNNY_WKD_PROXY:-true}
      # External storage at filebin.net through this server (docs/storage/filebin.md).
      FILEBUNNY_FILEBIN: ${FILEBUNNY_FILEBIN:-false}
      FILEBUNNY_PROXY_DAILY_BYTES: ${FILEBUNNY_PROXY_DAILY_BYTES:-53687091200}
      # E-mail: relays and passwords come from the smtp secret, never from
      # the environment. The default file has no relays: mail off.
      FILEBUNNY_SMTP_FILE: /run/secrets/smtp
      FILEBUNNY_PUBLIC_URL: https://${FILEBUNNY_DOMAIN:-localhost}
      FILEBUNNY_MAIL_DAILY: ${FILEBUNNY_MAIL_DAILY:-500}
      # Rate limiting and proof of work. Caddy passes the visitor's address
      # in this header; the backend only hashes it. The backend is reachable
      # through Caddy only, so clients cannot set the header themselves.
      FILEBUNNY_CLIENT_IP_HEADER: X-FileBunny-Client
      FILEBUNNY_RATE_LIMITS: ${FILEBUNNY_RATE_LIMITS:-true}
      FILEBUNNY_POW_BITS: ${FILEBUNNY_POW_BITS:-18}
    secrets: [smtp]
    logging: *logging
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      target: web
      args:
        VERSION: ${FILEBUNNY_VERSION:-dev}
        # Shown on the contact page; empty: not published.
        VITE_FILEBUNNY_CONTACT: ${FILEBUNNY_CONTACT:-}
        VITE_FILEBUNNY_ABUSE: ${FILEBUNNY_ABUSE:-}
        VITE_FILEBUNNY_SECURITY: ${FILEBUNNY_SECURITY:-}
    restart: unless-stopped
    environment:
      FILEBUNNY_DOMAIN: ${FILEBUNNY_DOMAIN:-localhost}
      FILEBUNNY_TLS: ${FILEBUNNY_TLS:-auto}
      FILEBUNNY_WWW_REDIRECT: ${FILEBUNNY_WWW_REDIRECT:-false}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]
    logging: *logging
    read_only: true
    tmpfs: [/tmp]
    # Caddy runs as UID 65532 without any capability; this sysctl (for the
    # container's network namespace only) lets it bind 80 and 443.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

# IPv6 on the network, so Docker forwards IPv6 visitors to Caddy with
# their own address (NAT). Without it they arrive through Docker's
# userland proxy with the proxy's address, so they would all share one
# rate limit; with the proxy off (deploy/ansible) they would not arrive.
networks:
  default:
    enable_ipv6: true

secrets:
  smtp:
    file: ${FILEBUNNY_SMTP:-./deploy/smtp-off.json}

volumes:
  data:
  caddy_data:
  caddy_config:
